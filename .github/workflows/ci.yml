name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: hub.docker.com/repository/docker/mhdkarimi/cicd-with-argocd

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Test application
        run: |
          python -m compileall app

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/cicd-with-argocd:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/cicd-with-argocd:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cicd-with-argocd:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cicd-with-argocd:latest

      - name: Update Helm image tag
        run: |
          sed -i 's/^  tag:.*/  tag: "${{ github.sha }}"/' \
            argocd-lab/k8s/values.yaml

      - name: Commit and push GitOps change
        run: |
          cd gitops

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/values.yaml

          git commit -m "Update FastAPI image to ${{ github.sha }}" || exit 0

          git push